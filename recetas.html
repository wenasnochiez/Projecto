<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Recetas</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div id="header"></div>

  <div class="content">
    <h1>Recetas</h1>

    <div class="recipe-grid">
      <div class="recipe-card" data-recipe="pancakes">
        <h2>Pancakes proteicos</h2>
        <p>Altos en proteína y esponjosos.</p>
      </div>

      <div class="recipe-card" data-recipe="crepes">
        <h2>Crepes proteicos</h2>
        <p>Finos, flexibles y altos en proteína.</p>
      </div>

      <div class="recipe-card" data-recipe="pupusa">
        <h2>Pupusa de queso</h2>
        <p>Tradicional y con relleno fundente.</p>
      </div>
    </div>
  </div>

  <!-- POPUP GENERAL -->
  <div id="recipe-popup" class="popup">
    <div class="popup-content">
      <span class="close-popup">✖</span>
      <h2 id="popup-title"></h2>
      <img id="popup-img" class="popup-img" />
      <h3>Ingredientes</h3>
      <ul id="popup-ingredients"></ul>
      <h3>Preparación</h3>
      <ol id="popup-steps"></ol>
    </div>
  </div>

  <div id="footer"></div>

  <script src="js/global.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
