<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calendario de Turnos - Oscuro Neón</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- FullCalendar principal -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

  <!-- Plugin de Google Calendar (necesario para googleCalendarApiKey) -->
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/google-calendar@6.1.8/index.global.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #0d0d0d;
      color: #e5e5e5;
    }

    header {
      background: #111;
      padding: 18px 30px;
      font-size: 1.4rem;
      font-weight: 600;
      color: #00bfff;
      border-bottom: 1px solid #00bfff33;
      box-shadow: 0 0 15px #00bfff33;
      text-shadow: 0 0 8px #00bfff;
    }

    .content {
      max-width: 1100px;
      margin: 40px auto;
      background: #111;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 0 25px #00bfff22;
      border: 1px solid #00bfff33;
    }

    h2 {
      margin-top: 0;
      color: #00bfff;
      text-shadow: 0 0 8px #00bfff;
    }

    #calendar {
      margin-top: 20px;
    }

    .fc {
      background: #111;
      color: #e5e5e5;
    }

    .fc-toolbar-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: #00bfff;
      text-shadow: 0 0 8px #00bfff;
    }

    .fc-button {
      background: #00bfff !important;
      border: none !important;
      border-radius: 8px !important;
      padding: 6px 12px !important;
      font-size: 0.9rem !important;
      font-weight: 500 !important;
      color: #000 !important;
      box-shadow: 0 0 10px #00bfff55;
      transition: 0.2s;
    }

    .fc-button:hover {
      background: #33d4ff !important;
      box-shadow: 0 0 16px #00e0ffaa;
    }

    @keyframes neonPulse {
      from { transform: scale(1); }
      to { transform: scale(1.03); }
    }
  </style>
</head>

<body>
<header>Mi Web Oscura Neón</header>

<div class="content">
  <h2>Calendario de Turnos</h2>
  <p>Consulta tus turnos sincronizados automáticamente desde Google Calendar.</p>
  <div id="calendar"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {

  // 🎨 Generador de color único por nombre
  function colorFromName(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) {
      hash = name.charCodeAt(i) + ((hash << 5) - hash);
    }
    const hue = Math.abs(hash) % 360;
    return `hsl(${hue}, 90%, 55%)`;
  }

  var calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
    initialView: 'dayGridMonth',

    googleCalendarApiKey: 'AIzaSyDgp1W2ygOSoJwv6VIXhzz2JAg075KFN3g',

    eventSources: [
      {
        googleCalendarId: 'f5bf2690b6d0d713c1265dc3683e002e37929d5b193ec468e542ddeedfe747bf@group.calendar.google.com'
      }
    ],

    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth,timeGridWeek,listWeek'
    },

    eventDidMount(info) {
      const title = info.event.title;
      const color = colorFromName(title);
      info.el.style.backgroundColor = color;
      info.el.style.color = "#000";
      info.el.style.border = "none";
      info.el.style.boxShadow = `0 0 12px ${color}, 0 0 20px ${color}`;
      info.el.style.animation = "neonPulse 1.8s ease-in-out infinite alternate";
    }
  });

  calendar.render();
});
</script>
</body>
</html>
