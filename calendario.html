<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calendario de Turnos - Oscuro Neón</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

  <style>
    /* --- ESTILO GLOBAL --- */
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #0d0d0d;
      color: #e5e5e5;
    }

    /* --- CABECERA --- */
    header {
      background: #111;
      padding: 18px 30px;
      font-size: 1.4rem;
      font-weight: 600;
      color: #00bfff;
      border-bottom: 1px solid #00bfff33;
      box-shadow: 0 0 15px #00bfff33;
      text-shadow: 0 0 8px #00bfff;
    }

    /* --- MENÚ --- */
    nav {
      background: #111;
      padding: 12px 30px;
      display: flex;
      gap: 25px;
      border-bottom: 1px solid #00bfff22;
    }

    nav a {
      text-decoration: none;
      color: #cccccc;
      font-weight: 500;
      transition: 0.2s;
    }

    nav a:hover {
      color: #00bfff;
      text-shadow: 0 0 8px #00bfff;
    }

    /* --- CONTENEDOR PRINCIPAL --- */
    .content {
      max-width: 1100px;
      margin: 40px auto;
      background: #111;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 0 25px #00bfff22;
      border: 1px solid #00bfff33;
    }

    h2 {
      margin-top: 0;
      color: #00bfff;
      text-shadow: 0 0 8px #00bfff;
    }

    p {
      color: #bbbbbb;
    }

    /* --- ESTILO FULLCALENDAR OSCURO NEÓN --- */
    #calendar {
      margin-top: 20px;
    }

    .fc {
      background: #111;
      color: #e5e5e5;
    }

    .fc-toolbar-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: #00bfff;
      text-shadow: 0 0 8px #00bfff;
    }

    .fc-button {
      background: #00bfff !important;
      border: none !important;
      border-radius: 8px !important;
      padding: 6px 12px !important;
      font-size: 0.9rem !important;
      font-weight: 500 !important;
      color: #000 !important;
      box-shadow: 0 0 10px #00bfff55;
      transition: 0.2s;
    }

    .fc-button:hover {
      background: #33d4ff !important;
      box-shadow: 0 0 16px #00e0ffaa;
    }

    .fc-daygrid-day-number,
    .fc-col-header-cell-cushion {
      color: #e5e5e5;
    }

    .fc-daygrid-day,
    .fc-timegrid-slot,
    .fc-list {
      background: #111;
      border-color: #333 !important;
    }

    .fc-day-today {
      background: #00111a !important;
    }

    .fc-event {
      background: #00bfff !important;
      border: none !important;
      border-radius: 6px !important;
      padding: 2px 4px !important;
      font-size: 0.85rem !important;
      color: #000 !important;
      box-shadow: 0 0 10px #00bfffaa;
    }
  </style>
</head>

<body>

<header>Mi Web Oscura Neón</header>

<nav>
  <a href="index.html">Inicio</a>
  <a href="calendario.html">Calendario</a>
  <a href="sobre.html">Sobre mí</a>
  <a href="ajustes.html">Ajustes</a>
</nav>

<div class="content">
  <h2>Calendario de Turnos</h2>
  <p>
    Consulta tus turnos sincronizados automáticamente desde Google Calendar, con un diseño oscuro y acentos neón.
  </p>

  <div id="calendar"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
    initialView: 'dayGridMonth',

    googleCalendarApiKey: 'AIzaSyDgp1W2ygOSoJwv6VIXhzz2JAg075KFN3g',

    eventSources: [
      {
        googleCalendarId: 'f5bf2690b6d0d713c1265dc3683e002e37929d5b193ec468e542ddeedfe747bf@group.calendar.google.com',
        className: 'gcal-event'
      }
    ],

    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth,timeGridWeek,listWeek'
    }
  });

  calendar.render();
});
</script>

</body>
</html>
